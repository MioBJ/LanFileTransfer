# ============================================
# 局域网文件传输服务 - Docker Compose配置
# ============================================

services:
  # 文件传输服务
  file-transfer-service:
    # 镜像名称和标签
    image: lan-file-transfer:latest
    
    # 容器名称
    container_name: lan-file-transfer
    
    # 构建配置
    build:
      context: .                    # 构建上下文（当前目录）
      dockerfile: Dockerfile        # Dockerfile路径
    
    # 端口映射（宿主机端口:容器端口）
    ports:
      - "8000:8000"                # API服务端口
    
    # 数据卷挂载（持久化数据）
    volumes:
      - ./storage:/app/storage     # 文件存储目录
      - ./logs:/app/logs           # 日志目录
      - /etc/localtime:/etc/localtime:ro  # 同步主机时区（只读）
      # - ./app:/app/app           # 开发模式：挂载代码（可选）
    
    # 环境变量配置
    environment:
      # 时区配置
      - TZ=Asia/Shanghai           # 设置时区为上海（东八区）
      
      # 服务配置
      - APP_NAME=局域网文件传输服务
      - VERSION=1.0.0
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=2
      
      # 存储配置
      - STORAGE_PATH=storage
      - TEMP_PATH=storage/temp
      - UPLOADS_PATH=storage/uploads
      
      # 上传配置
      - CHUNK_SIZE=10485760          # 10MB
      - CHUNK_THRESHOLD=10485760     # 10MB
      - MAX_CONCURRENT_UPLOADS=10
      
      # 日志配置
      - LOG_LEVEL=INFO
      - LOG_PATH=logs
    
    # 重启策略
    restart: unless-stopped         # 除非手动停止，否则自动重启
    
    # 网络模式（host模式方便局域网访问）
    # network_mode: host            # 可选：使用宿主机网络（便于局域网访问）
    
    # 资源限制（可选）
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'               # CPU限制
    #       memory: 2G              # 内存限制
    #     reservations:
    #       cpus: '1'
    #       memory: 1G
    
    # 健康检查
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s                # 检查间隔
      timeout: 10s                 # 超时时间
      retries: 3                   # 重试次数
      start_period: 10s            # 启动等待时间

# ============================================
# 网络配置（可选）
# ============================================
# networks:
#   lan-network:
#     driver: bridge

# ============================================
# 数据卷配置（可选，如果使用命名卷）
# ============================================
# volumes:
#   storage-data:
#   logs-data:

